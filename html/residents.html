<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<title>Residents | VIRAT-7</title>

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
rel="stylesheet">

<link rel="stylesheet" href="../css/header.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins;
}

body{
background:#f4f6fb;
}

/* MAIN */

main{
padding:14px;
}


/* TOTAL */

.total{
background:linear-gradient(135deg,#5a67d8,#7c8cff);
color:white;
padding:16px;
border-radius:18px;
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:12px;
box-shadow:0 10px 20px rgba(0,0,0,.15);
}


/* SEARCH */

.search{
width:100%;
padding:13px;
border-radius:14px;
border:none;
margin-bottom:10px;
background:#fff;
box-shadow:0 4px 10px rgba(0,0,0,.08);
}


/* SECTION */

.section{
margin:10px 4px;
font-size:14px;
color:#555;
}


/* CARD */

.card{
background:white;
border-radius:18px;
padding:12px;
margin-bottom:12px;
display:flex;
align-items:center;
justify-content:space-between;
box-shadow:0 6px 14px rgba(0,0,0,.08);
cursor:pointer;
transition:.2s;
}

.card:active{
transform:scale(.98);
}

.card.admin{
background:linear-gradient(135deg,#5a67d8,#7c8cff);
color:white;
}


/* ROW */

.row{
display:flex;
align-items:center;
gap:10px;
}


/* AVATAR */

.avatar{
width:46px;
height:46px;
border-radius:50%;
background:#5a67d8;
color:white;
display:flex;
align-items:center;
justify-content:center;
font-weight:600;
font-size:18px;
box-shadow:0 4px 10px rgba(0,0,0,.2);
}


/* TEXT */

.name{
font-weight:600;
}

.flat{
font-size:13px;
opacity:.8;
line-height:1.3;
}


/* BUTTONS */

.btns{
display:flex;
gap:8px;
}

.btn{
width:40px;
height:40px;
border-radius:50%;
background:#22c55e;
display:flex;
align-items:center;
justify-content:center;
color:white;
font-size:16px;
box-shadow:0 4px 10px rgba(0,0,0,.2);
}


/* MODAL */

.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.35);
display:none;
align-items:center;
justify-content:center;
backdrop-filter:blur(4px);
}

.modal-box{
background:white;
padding:22px;
border-radius:18px;
width:260px;
text-align:center;
animation:pop .2s;
}

@keyframes pop{
from{transform:scale(.8);opacity:0}
to{transform:scale(1);opacity:1}
}

.modal .avatar{
margin:auto;
margin-bottom:10px;
}

.close{
margin-top:10px;
padding:8px 14px;
border:none;
border-radius:10px;
background:#eee;
}

</style>

</head>

<body>


<header class="app-header">

<button class="back-btn"
onclick="history.back()">

<i class="fa-solid fa-arrow-left"></i>

</button>

<h3 class="page-title">

Residents Directory

</h3>

<div class="header-spacer"></div>

</header>



<main>


<div class="total">

<div>
Total Residents<br>
<b id="total">0</b>
</div>

<i class="fa fa-users" style="font-size:26px"></i>

</div>



<input
id="search"
class="search"
placeholder="Search name / flat / phone">


<div class="section">Admin</div>
<div id="adminList"></div>

<div class="section">Residents</div>
<div id="residentList"></div>


</main>



<!-- POPUP -->

<div id="modal" class="modal">

<div class="modal-box">

<div id="mAvatar" class="avatar"></div>

<h3 id="mName"></h3>

<p id="mFlat"></p>

<br>

<div class="btns" style="justify-content:center">

<div id="callBtn" class="btn">
<i class="fa fa-phone"></i>
</div>

<div id="waBtn" class="btn">
<i class="fa-brands fa-whatsapp"></i>
</div>

</div>

<button class="close" onclick="closeModal()">
Close
</button>

</div>

</div>



<script type="module">

import { db } from "../js/firebase.js";

import {
collection,
getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


let users=[];

const adminList=document.getElementById("adminList");
const residentList=document.getElementById("residentList");
const total=document.getElementById("total");
const search=document.getElementById("search");



async function load(){

const snap=await getDocs(
collection(db,"users")
);

users=[];

snap.forEach(d=>{
users.push(d.data());
});

total.innerText=users.length;

render();

}



function render(){

adminList.innerHTML="";
residentList.innerHTML="";

const q=(search.value||"").toLowerCase();


users.forEach(u=>{

const name=u.name||"User";
const flat=u.flat||"-";
const phone=u.phone||"";

if(
!name.toLowerCase().includes(q) &&
!flat.toLowerCase().includes(q) &&
!phone.includes(q)
) return;


const card=document.createElement("div");

card.className="card";

if(u.role==="admin"){
card.classList.add("admin");
}


card.innerHTML=`

<div class="row">

<div class="avatar">
${name[0]}
</div>

<div>

<div class="name">
${name}
</div>

<div class="flat">
Flat ${flat}<br>
${phone}
</div>

</div>

</div>

<div class="btns">

<div class="btn"
onclick="event.stopPropagation();call('${phone}')">

<i class="fa fa-phone"></i>

</div>

<div class="btn"
onclick="event.stopPropagation();wa('${phone}')">

<i class="fa-brands fa-whatsapp"></i>

</div>

</div>
`;

card.onclick=()=>openModal(name,flat,phone);

if(u.role==="admin"){
adminList.appendChild(card);
}else{
residentList.appendChild(card);
}

});

}



search.oninput=render;



window.call=(p)=>{

if(!p) return;

location.href="tel:"+p;

};


window.wa=(p)=>{

if(!p) return;

p=p.replace(/\D/g,'');

if(!p.startsWith("91")){
p="91"+p;
}

location.href="https://wa.me/"+p;

};


function openModal(name,flat,phone){

modal.style.display="flex";

mAvatar.innerText=name[0];

mName.innerText=name;

mFlat.innerText="Flat "+flat+"\n"+phone;

callBtn.onclick=()=>call(phone);

waBtn.onclick=()=>wa(phone);

}


window.closeModal=()=>{
modal.style.display="none";
};


load();

</script>

</body>
</html>
